        "apps/web/src/**/*.tsx"
      ],
      "check": {
        "kind": "library",
        "rule": "forbidden-pattern",
        "pattern": "$PROJECT.taskManager",
        "examples": {
          "bad": "const manager = project.taskManager;",
          "good": "const manager = getTaskManagerStore(projectId);"
        }
      },
      "fix": "Use getTaskManagerStore(projectId) instead."
