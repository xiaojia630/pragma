        "para_hash": "28ebb56d72546910",
        "lines": [
          119,
          119
        ],
        "quote": "- Use top-level `import` statements; do not use `require()`."
      },
      "text": "Use top-level import statements, not require().",
      "scope": [
        "**/*.ts",
        "**/*.tsx",
        "**/*.mts",
        "**/*.cts"
      ],
      "check": {
        "kind": "library",
        "rule": "forbidden-pattern",
        "pattern": "require($$$ARGS)",
        "examples": {
          "bad": "const kit = require('drizzle-kit/api');",
          "good": "import kit from 'drizzle-kit/api';"
        }
      },
      "fix": "Use a top-level import. For a CommonJS-only module, keep createRequire and record a deliberate exception."
    },
