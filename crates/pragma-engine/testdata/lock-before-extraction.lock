          298,
          298
        ],
        "quote": "- Never use `asProvisioned(...)!` or `asAvailableProject(...)!`; use explicit null checks."
      },
      "text": "Never use asAvailableProject(...)!; use explicit null checks.",
      "scope": [
        "**/*.ts",
        "**/*.tsx",
        "**/*.mts",
        "**/*.cts"
      ],
      "check": {
        "kind": "library",
        "rule": "forbidden-pattern",
        "pattern": "asAvailableProject($$$ARGS)!",
        "examples": {
          "bad": "const host = asAvailableProject(store)!.host;",
          "good": "const project = asAvailableProject(store);"
        }
      },
      "fix": "const project = asAvailableProject(store); if (!project) return; then use project."
    },
