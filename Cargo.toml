[workspace]
resolver = "3"
members = ["crates/pragma-engine", "crates/pragma-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
ast-grep-core = "0.51.0"
ast-grep-language = { version = "0.51.0", default-features = false, features = [
  "tree-sitter-javascript",
  "tree-sitter-typescript",
] }
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
libc = "0.2.190"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_norway = "0.9.42"
similar = "3.2.0"
tempfile = "3.27.0"
